server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;
  # Security headers: in every location (a location with its own add_header drops the server's).
  include /etc/nginx/snippets/security-headers.conf;

  # The APK and its description (config.js) live in the backend's public `downloads` bucket.
  # They are served from here so the backend address (BACKEND_URL, a service variable) stays out of the repository.
  location = /config.js {
    proxy_pass ${BACKEND_URL}/storage/v1/object/public/downloads/config.js;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    # The storage's own headers are replaced by ours.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
  location = /fft.apk {
    proxy_pass ${BACKEND_URL}/storage/v1/object/public/downloads/fft.apk;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_buffering off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Disposition 'attachment; filename="fft.apk"';
  }
  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Legal pages without the extension: /privacy, /terms, /delete-account.
  location / { try_files $uri $uri.html $uri/ =404; }
}
