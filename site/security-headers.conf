# Security headers of the install and legal pages (DECISIONS 77). Included in EVERY location of
# site/nginx.conf: nginx drops the server's add_header lines in a location that has its own.
# Static pages: scripts, styles, fonts and images from this site only (the inline <style> of the
# install page aside), never inside a frame.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
