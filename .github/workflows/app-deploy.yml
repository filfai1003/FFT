# On every push to main that touches the app: if the native part changed (a new native package, a new
# Expo SDK, native config) it builds a new installable APK (EAS Build, profile "preview"); otherwise it
# publishes a simple over-the-air update (EAS Update, branch "preview") that installed apps pick up the
# next time they are opened. The choice is made by the project "fingerprint" (runtimeVersion policy in
# app.json): an update only reaches builds with the same native fingerprint.
# The server (Railway) redeploys by itself from the same push.
# Needs the repository secret EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
name: App deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - 'site/**'
      - 'admin/**'
      - 'web/**'
      - 'supabase/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 25.1.1
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: expo/expo-github-action/continuous-deploy-fingerprint@eab7a230208c952974db8c3245cfd78402c7b385 # main on 2026-10-18
        with:
          profile: preview
          branch: preview
          # Loads the EAS environment variables (backend URL and anon key) into the update bundle.
          environment: preview
          platform: android
