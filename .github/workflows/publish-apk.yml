# Puts the newest finished Android build (EAS, profile "preview") on the install page: copies the APK to
# the public `downloads` bucket and publishes its description (config.js) there. Runs every 3 hours and by hand
# (Actions -> "Publish APK" -> Run workflow); does nothing when the page already has that build.
# Needs the repository secrets EXPO_TOKEN, SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
name: Publish APK

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # To start App deploy after a new APK (see the last step).
  actions: write

concurrency:
  group: publish-apk

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Find the newest finished build
        id: build
        run: |
          eas build:list --platform android --build-profile preview --status finished --limit 1 --json --non-interactive > build.json
          echo "id=$(node -p "JSON.parse(require('fs').readFileSync('build.json'))[0]?.id ?? ''")" >> "$GITHUB_OUTPUT"
          echo "url=$(node -p "JSON.parse(require('fs').readFileSync('build.json'))[0]?.artifacts?.buildUrl ?? ''")" >> "$GITHUB_OUTPUT"
      - name: Publish when it is new
        id: publish
        if: steps.build.outputs.id != ''
        env:
          BUILD_ID: ${{ steps.build.outputs.id }}
          BUILD_URL: ${{ steps.build.outputs.url }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if curl -fsSL "$SUPABASE_URL/storage/v1/object/public/downloads/config.js" | grep -q "$BUILD_ID"; then echo "Already published"; exit 0; fi
          curl -fsSL -o fft.apk "$BUILD_URL"
          APK_BUILD_ID="$BUILD_ID" node supabase/scripts/publish-apk.mjs fft.apk
          echo "new=true" >> "$GITHUB_OUTPUT"
      # An installed APK ignores updates older than its own build. Code pushed while the build ran
      # (its update was published before the build finished) would never reach it: publish the
      # latest code again, now newer than the APK.
      - name: Publish the latest update again
        if: steps.publish.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run app-deploy.yml --ref main
