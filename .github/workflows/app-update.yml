# Every push to main that changes the app publishes an over-the-air update (EAS Update) to the
# installed Android app. The server (Railway) redeploys by itself from the same push.
# Needs the repository secret EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
name: App update

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
