# Security headers of the web app (DECISIONS 78). Included in EVERY location of web/nginx.conf:
# nginx drops the server's add_header lines in a location that has its own.
# Content-Security-Policy for the Expo web export:
# - scripts: the bundles from this site, plus the one inline line Expo Router writes in every page
#   (globalThis.__EXPO_ROUTER_HYDRATE__=true;), allowed by its hash. If Expo changes that line the
#   browser only skips it and the page renders without hydrating (no breakage).
# - styles: react-native-web writes <style> tags and style attributes at run time ('unsafe-inline').
# - connections: our backend and API, and the AI provider the user picks with their own key (any
#   https address, so https: and no list of hosts).
# - images: exercise pictures and photos (signed storage URLs, blob: and data: previews).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-67fhrP0+BkBqmgGGXTtgiVO/9EQs3QruYNU/7fnRkI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: blob: data:; media-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
