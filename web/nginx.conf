server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;
  add_header X-Frame-Options DENY;

  # Bundles have a hash in their name: cache them for good.
  location /_expo/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Pages are pre-rendered (`/train` -> train.html); any other path (ids in the URL) is handled
  # by the app's router in the browser.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
