server {
  listen ${PORT};
  root /usr/share/nginx/html;
  index index.html;
  # Security headers: in every location (a location with its own add_header drops the server's).
  include /etc/nginx/snippets/security-headers.conf;

  # Bundles have a hash in their name: cache them for good.
  location /_expo/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Pages are pre-rendered (`/train` -> train.html); any other path (ids in the URL) is handled
  # by the app's router in the browser.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
