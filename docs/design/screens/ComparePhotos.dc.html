<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare photos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 34px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Photos.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<div role="radiogroup" aria-label="View" style="display: flex; gap: 4px; padding: 3px; border-radius: 20px; border: 1px solid #262626; background: #0d0d0d">
<button role="radio" aria-checked="true" style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">SIDE BY SIDE</button>
<button role="radio" aria-checked="false" style="height: 44px; padding: 0 12px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">SLIDER</button>
</div>
</div>

<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">COMPARE</h1>

<div style="display: flex; gap: 8px">
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px">FRONT</button>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 11px">SIDE</button>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 11px">BACK</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{sides}}" as="s" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 8px">
<button aria-label="Change date, now {{s.date}}" style="height: 44px; border-radius: 14px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-family: 'Space Mono', monospace; font-size: 11px">{{s.date}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<div style="height: 300px; border-radius: 18px; border: 1px dashed #6e6e6e; background: #161616; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #666">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="2.5"/><path d="M8 21v-6l-2-1 1-5h10l1 5-2 1v6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">FRONT</span>
</div>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e; text-align: center">{{s.info}}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #111; border: 1px solid #262626; border-radius: 20px; padding: 14px 0">
<sc-for list="{{diff}}" as="d" hint-placeholder-count="3">
<span style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 22px; line-height: 1">{{d.v}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8e8e8e">{{d.l}}</span></span>
</sc-for>
</div>

<span style="color: #8e8e8e; text-align: center; font-size: 13px; line-height: 1.45">For fair comparisons, keep the same light, time of day and distance. The camera shows a faint outline of your last photo.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
sides: [
{ date: 'JUL 16', info: '81.2 KG · 18.9%' },
{ date: 'OCT 1', info: '78.7 KG · 17.0%' }
],
diff: [{ v: '−2.5', l: 'KG' }, { v: '−1.9', l: 'BODY FAT PTS' }, { v: '−3.0', l: 'WAIST CM' }]
};
}
}
</script>
</body>
</html>
