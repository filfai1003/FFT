<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – my plans</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8e8e8e">CYCLE 3</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 44px; line-height: 1">TRAIN</h1>
</div>
<button aria-label="New plan" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 12px">
<a href="SchedaDettaglio.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>ACTIVE PLAN</span>
<span style="font-size: 20px; font-weight: 500">PPL 4-day</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<span style="height: 40px; border-radius: 12px; background: #1a1a1a; border: 1px solid #6e6e6e; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>PULL</span>
<span style="height: 40px; border-radius: 12px; border: 1px solid #fff; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px">PUSH</span>
<span style="height: 40px; border-radius: 12px; background: #1a1a1a; border: 1px dashed #666; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>LEGS</span>
<span style="height: 40px; border-radius: 12px; border: 1px dashed #6e6e6e; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">UPPER</span>
</div>
<span style="color: #8e8e8e; font-size: 13px; line-height: 1.45">Legs was done out of order on Wednesday, so Push is still up next.</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px dashed #2e2e2e">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">UP NEXT</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 26px; line-height: 1">PUSH A</span>
<span style="font-size: 13px; color: #8e8e8e">6 exercises · ~55 min</span>
</span>
<a href="Sessione.dc.html" style="text-decoration: none; background: {{accent}}; color: #f2f2f2; border-radius: 26px; height: 52px; padding: 0 22px; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg>Start</a>
</div>
<a href="SchedaDettaglio.dc.html" style="text-decoration: none; color: #ccc; display: flex; align-items: center; justify-content: space-between; min-height: 44px; border-top: 1px dashed #2e2e2e; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN A DIFFERENT DAY<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Libreria.dc.html" style="text-decoration: none; color: #f2f2f2; background: #0d0d0d; border: 1px solid #262626; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 92px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Library</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">EXERCISES</span></span>
</a>
<a href="Storico.dc.html" style="text-decoration: none; color: #f2f2f2; background: #0d0d0d; border: 1px solid #262626; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 92px; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">History</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">LAST: YESTERDAY</span></span>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e; padding: 4px 4px 0">OTHER PLANS</span>
<sc-for list="{{plans}}" as="p" hint-placeholder-count="2">
<a href="SchedaDettaglio.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px 0 16px; border-radius: 18px; border: 1px solid #262626; background: #0d0d0d">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px">{{p.name}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{p.info}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
plans: [
{ name: 'Full body 3-day', info: '3 DAYS · ARCHIVED' },
{ name: 'Strength 5×5', info: '3 DAYS · DRAFT' }
]
};
}
}
</script>
</body>
</html>
