<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strength</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Progress.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">LAST 12 WEEKS</span>
</div>

<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">STRENGTH</h1>

<div role="tablist" aria-label="Group by" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; border: 1px solid #262626; background: #0d0d0d">
<button role="tab" aria-selected="true" style="height: 44px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">MUSCLE GROUPS</button>
<button role="tab" aria-selected="false" style="height: 44px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">EXERCISES</button>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 44px; line-height: 1">+8.4%</span>
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>OVERALL</span>
</div>
<div role="img" aria-label="Overall strength up 8.4 percent over 12 weeks, rising every week" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<sc-for list="{{c.off}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #222"></span></sc-for>
<sc-for list="{{c.on}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #fff"></span></sc-for>
</div>
</sc-for>
</div>
<span style="padding-top: 10px; border-top: 1px dashed #2e2e2e; color: #8e8e8e; font-size: 13px; line-height: 1.45">Average change in estimated 1RM across every exercise you trained, weighted by sets.</span>
</div>

<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">BY MUSCLE GROUP</h2>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<a href="MuscleGroup.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px dashed #262626">
<span style="width: 92px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{g.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{g.sets}} SETS</span></span>
<span aria-hidden="true" style="flex: 1; display: flex; gap: 3px">
<sc-for list="{{g.on}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{g.off}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</span>
<span style="width: 52px; text-align: right; font-family: 'Space Mono', monospace; font-size: 13px">{{g.pct}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</section>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Plans.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="FoodLog.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progress.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Profile.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const s = [0, 0.8, 1.5, 2.4, 3.1, 3.6, 4.5, 5.2, 6.0, 6.9, 7.6, 8.4];
const g = (name, sets, v) => {
const n = Math.round((v / 12) * 12);
return { name, sets, pct: '+' + v.toFixed(1) + '%', on: dots(n), off: dots(12 - n) };
};
return {
accent: this.props.accent ?? '#D71921',
cols: s.map((v) => {
const on = Math.max(1, Math.round((v / 8.4) * 9) + 1);
return { on: dots(on), off: dots(10 - on) };
}),
groups: [g('Back', 72, 11.2), g('Chest', 64, 9.1), g('Shoulders', 48, 7.4), g('Legs', 60, 6.0), g('Arms', 54, 5.2)]
};
}
}
</script>
</body>
</html>
