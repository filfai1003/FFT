<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; overflow: hidden">

<div aria-hidden="true" style="opacity: 0.3; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e"></span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PUSH A · IN PROGRESS</span><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 26px">00:52:40</span></span>
<span style="height: 44px; width: 64px; border-radius: 22px; background: {{accent}}"></span>
</div>
<div style="display: flex; gap: 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: #fff"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #fff"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #fff"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #fff"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a"></span></div>
<span style="font-size: 28px; font-weight: 500">Lateral raise</span>
<span style="height: 260px; border-radius: 24px; background: #111; border: 1px solid #262626"></span>
<span style="height: 150px; border-radius: 24px; background: #111; border: 1px solid #262626"></span>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0, 0, 0, 0.6)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="finish-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #111; border-top: 1px solid #6e6e6e; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 18px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #444"></span>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="finish-title" style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 30px; line-height: 1.05">FINISH NOW?</h2>
<p style="margin: 0; font-size: 15px; color: #ccc; line-height: 1.45">You completed 4 of 6 exercises. Sets you haven't checked off won't be saved.</p>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px dashed #2e2e2e">
<sc-for list="{{left}}" as="e" hint-placeholder-count="2">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px dashed #2e2e2e">
<span style="font-size: 14px">{{e.name}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{e.state}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="SessionSummary.dc.html" style="text-decoration: none; height: 54px; border-radius: 27px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px">Finish and save</a>
<a href="ActiveSession.dc.html" style="text-decoration: none; height: 54px; border-radius: 27px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-size: 16px">Keep training</a>
<button style="height: 44px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-decoration: underline">DISCARD WORKOUT</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
left: [
{ name: 'Lateral raise', state: '1/3 SETS' },
{ name: 'Rope pushdown', state: 'NOT STARTED' }
]
};
}
}
</script>
</body>
</html>
