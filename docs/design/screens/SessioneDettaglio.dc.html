<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Storico.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<button aria-label="More options: edit, delete" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">MON OCT 05 · 18:40 · PPL 4-DAY</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">PULL A</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #111; border: 1px solid #262626; border-radius: 20px; padding: 14px 0">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 24px; line-height: 1">{{s.val}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">{{s.label}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{exs}}" as="e" hint-placeholder-count="4">
<section style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 10px 12px 12px; display: flex; gap: 12px">
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<a href="EsercizioDettaglio.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; justify-content: space-between; align-items: center; min-height: 24px; gap: 8px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; min-width: 0">{{e.name}}<sc-if value="{{e.hasPr}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 4px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #ccc; flex-shrink: 0"><span style="width: 5px; height: 5px; border-radius: 3px; background: {{accent}}"></span>{{e.pr}}</span></sc-if></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
</a>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{e.sets}}" as="s"><span style="height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid #6e6e6e; display: flex; align-items: center; font-family: 'Space Mono', monospace; font-size: 11px">{{s}}</span></sc-for>
</div>
</div>
</section>
</sc-for>
</div>

<a href="Sessione.dc.html" style="text-decoration: none; height: 48px; border-radius: 24px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>Repeat this workout</a>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ex = (name, pr, sets) => ({ name, pr, hasPr: !!pr, sets });
return {
accent: this.props.accent ?? '#D71921',
stats: [{ val: '54', label: 'MINUTES' }, { val: '7.9', label: 'TONNES' }, { val: '21', label: 'SETS' }],
exs: [
ex('Pull-ups', 'BEST REPS', ['10', '9', '8', '7']),
ex('Barbell row', 'NEW EST. 1RM', ['70×8', '70×8', '70×7', '65×8']),
ex('Lat pulldown', '', ['60×10', '60×10', '60×9']),
ex('Dumbbell curl', '', ['14×10', '14×10', '12×12'])
]
};
}
}
</script>
</body>
</html>
