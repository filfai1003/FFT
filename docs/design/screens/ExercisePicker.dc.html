<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick exercises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 106px; gap: 14px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="DayEditor.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">ADD TO</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 26px; line-height: 1">PUSH A</span>
</div>
</div>

<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 26px; background: #111; border: 1px solid #6e6e6e">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercise</span>
<input type="search" placeholder="Search exercise" style="flex: 1; min-width: 0; border: none; background: transparent; color: #f2f2f2; font-family: inherit; font-size: 16px; outline: none">
</label>

<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -20px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em">{{c.label}}</button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="e" hint-placeholder-count="7">
<label style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px dashed #262626; cursor: pointer">
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px">{{e.name}}<sc-if value="{{e.inDay}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">IN DAY</span></sc-if></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{e.info}}</span>
</span>
<input type="checkbox" checked="{{e.sel}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<sc-if value="{{e.sel}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span></sc-if>
<sc-if value="{{e.notSel}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 1px solid #6e6e6e"></span></sc-if>
</label>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 34px; border-top: 1px solid #262626; background: #0d0d0d; display: flex; gap: 10px">
<a href="CreateExercise.dc.html" style="text-decoration: none; height: 52px; padding: 0 18px; border-radius: 26px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">+ Create new</a>
<a href="DayEditor.dc.html" style="flex: 1; text-decoration: none; height: 52px; border-radius: 26px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px">Add 2 exercises</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chip = (label, on) => ({ label, on, off: !on });
const ex = (name, info, sel, inDay) => ({ name, info, sel, notSel: !sel, inDay });
return {
accent: this.props.accent ?? '#D71921',
chips: [chip('ALL', false), chip('CHEST', true), chip('SHOULDERS', false), chip('TRICEPS', false), chip('BACK', false), chip('LEGS', false)],
items: [
ex('Barbell bench press', 'CHEST · BARBELL', false, true),
ex('Incline dumbbell press', 'UPPER CHEST · DUMBBELLS', false, true),
ex('Chest press', 'CHEST · MACHINE', true, false),
ex('Parallel bar dips', 'CHEST · TRICEPS · BODYWEIGHT', true, false),
ex('Cable fly', 'CHEST · CABLES', false, true),
ex('Dumbbell fly', 'CHEST · DUMBBELLS', false, false),
ex('Push-ups', 'CHEST · BODYWEIGHT', false, false)
]
};
}
}
</script>
</body>
</html>
