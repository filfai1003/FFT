<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 172px; gap: 16px; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>PUSH A · THU OCT 08</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 64px; line-height: 1">DONE</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{s.label}}</span>
<span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 32px; line-height: 1">{{s.val}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{s.unit}}</span></span>
</div>
</sc-for>
</div>

<section style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 6px 16px">
<sc-for list="{{records}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px dashed #262626">
<span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}; flex-shrink: 0"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{r.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{r.detail}}</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-align: right">{{r.badge}}</span>
</div>
</sc-for>
</section>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">HOW DID IT FEEL?</legend>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{feel}}" as="f" hint-placeholder-count="5">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}"><button style="height: 52px; border-radius: 16px; border: 1px solid #fff; background: #161616; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 18px; line-height: 1">{{f.n}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.04em">{{f.label}}</span></button></sc-if>
<sc-if value="{{f.off}}" hint-placeholder-val="{{ true }}"><button style="height: 52px; border-radius: 16px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 18px; line-height: 1">{{f.n}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: #8e8e8e">{{f.label}}</span></button></sc-if>
</sc-for>
</div>
</fieldset>

<label style="display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Workout notes</span>
<input type="text" placeholder="Notes (optional)" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; padding: 0 16px; font-family: inherit; font-size: 16px">
</label>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626; display: flex; flex-direction: column; gap: 10px">
<a href="Main.dc.html" style="text-decoration: none; height: 54px; border-radius: 27px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px">Save and close</a>
<a href="SessionDetail.dc.html" style="text-decoration: none; height: 48px; border-radius: 24px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-size: 15px">See all sets</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const f = (n, label, on) => ({ n, label, on, off: !on });
return {
accent: this.props.accent ?? '#D71921',
stats: [
{ label: 'DURATION', val: '52:40', unit: 'MIN' },
{ label: 'VOLUME', val: '7820', unit: 'KG' },
{ label: 'SETS', val: '19', unit: '/ 22' },
{ label: 'RECORDS', val: '2', unit: 'NEW' }
],
records: [
{ name: 'Incline dumbbell press', detail: '26 KG × 10 · WAS 24 KG', badge: 'NEW MAX' },
{ name: 'Seated DB shoulder press', detail: '22 × 9 → 29 KG · WAS 28 KG', badge: 'NEW EST. 1RM' }
],
feel: [f(1, 'EASY', false), f(2, 'OK', false), f(3, 'GOOD', false), f(4, 'HARD', true), f(5, 'MAX', false)]
};
}
}
</script>
</body>
</html>
