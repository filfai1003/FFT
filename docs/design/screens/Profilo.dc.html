<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8e8e8e">MEMBER SINCE JUL 2026</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 44px; line-height: 1">PROFILE</h1>
</div>

<a href="ProfiloInfo.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 14px; padding: 14px 14px 14px 16px; border-radius: 22px; border: 1px solid #262626; background: #111">
<span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; border: 1px solid #6e6e6e; background: #161616; display: flex; align-items: center; justify-content: center; font-family: 'Doto', monospace; font-weight: 800; font-size: 22px">AM</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 17px; font-weight: 500">Alex Morgan</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 8px; border: 1px solid #6e6e6e; color: #ccc">FREE</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">31 Y · 180 CM · 78.4 KG</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 22px; border: 1px dashed #6e6e6e; background: #0d0d0d">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PREMIUM</span>
<span style="font-size: 14px; line-height: 1.35">Widgets, app sync, AI plans and coaching</span>
</span>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0">SEE PLANS</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="border-radius: 20px; border: 1px solid #262626; background: #0d0d0d; padding: 0 14px 0 16px">
<sc-for list="{{g.rows}}" as="r">
<a href="{{r.href}}" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: {{r.border}}">
<span style="flex: 1; font-size: 15px">{{r.name}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{r.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</div>
</sc-for>
</div>

<button style="height: 44px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em">LOG OUT</button>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const row = (name, value, href, first) => ({ name, value, href, border: first ? 'none' : '1px dashed #262626' });
return {
accent: this.props.accent ?? '#D71921',
groups: [
{ rows: [row('Personal info', '', 'ProfiloInfo.dc.html', true), row('Diet goals & mode', '2350 KCAL', 'ObiettiviDieta.dc.html', false)] },
{ rows: [row('Units, look & alerts', 'KG · CM', 'Impostazioni.dc.html', true), row('Accessibility', '', 'Accessibilita.dc.html', false)] },
{ rows: [row('Privacy & data', '', 'ProfiloDati.dc.html', true), row('Help & feedback', '', 'Profilo.dc.html', false)] }
]
};
}
}
</script>
</body>
</html>
