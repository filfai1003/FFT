<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 18px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="ExercisePicker.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NEW EXERCISE</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<div style="display: flex; align-items: flex-end; gap: 12px">
<button aria-label="Add image" style="padding: 0; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">
<dc-import name="ExerciseIcon" src="" size="52" hint-size="52px,52px"></dc-import>
</button>
<label style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NAME · IMAGE OPTIONAL</span>
<input type="text" value="Incline Smith press" style="height: 52px; box-sizing: border-box; width: 100%; border-radius: 16px; border: 1px solid #fff; background: #111; color: #f2f2f2; padding: 0 16px; font-family: inherit; font-size: 17px">
</label>
</div>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">WHAT YOU LOG</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button style="min-height: 64px; padding: 10px 14px; border-radius: 16px; border: 1px solid #fff; background: #161616; color: #f2f2f2; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; font-family: inherit; text-align: left"><span style="font-size: 14px; font-weight: 500">{{t.label}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{t.ex}}</span></button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button style="min-height: 64px; padding: 10px 14px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; font-family: inherit; text-align: left"><span style="font-size: 14px">{{t.label}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{t.ex}}</span></button></sc-if>
</sc-for>
</div>
</fieldset>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<fieldset style="border: none; margin: 0; padding: 0">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{g.title}}</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{g.chips}}" as="c">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.04em">{{c.label}}</button></sc-if>
</sc-for>
</div>
</fieldset>
</sc-for>

<span style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8e8e8e">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
Only visible to you. Edit it any time from the library.</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="ExercisePicker.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save exercise</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const c = (label, on) => ({ label, on, off: !on });
const t = (label, ex, on) => ({ label, ex, on, off: !on });
return {
accent: this.props.accent ?? '#D71921',
types: [t('Weight and reps', 'E.G. 60 KG × 8', true), t('Reps only', 'E.G. PULL-UPS × 10', false), t('Time', 'E.G. PLANK 1:00', false), t('Distance and time', 'E.G. RUN 5 KM', false)],
groups: [
{ title: 'PRIMARY MUSCLE', chips: [c('CHEST', true), c('BACK', false), c('SHOULDERS', false), c('BICEPS', false), c('TRICEPS', false), c('LEGS', false), c('GLUTES', false), c('ABS', false)] },
{ title: 'SECONDARY MUSCLES', chips: [c('SHOULDERS', true), c('TRICEPS', true), c('BACK', false), c('ABS', false)] },
{ title: 'EQUIPMENT', chips: [c('BARBELL', false), c('DUMBBELLS', false), c('MACHINE', true), c('CABLES', false), c('BODYWEIGHT', false), c('BANDS', false)] }
]
};
}
}
</script>
</body>
</html>
