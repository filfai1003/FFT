<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8e8e8e">OCTOBER 2026</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">FOOD LOG</h1>
</div>
<div style="display: flex; gap: 8px">
<a href="DietGoals.dc.html" aria-label="Goals and tracking mode" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
</a>
<button aria-label="Open calendar" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7">
<sc-if value="{{w.sel}}" hint-placeholder-val="{{ false }}">
<button aria-label="Day {{w.n}}" aria-current="date" style="height: 56px; border-radius: 18px; border: 1px solid #fff; background: #161616; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: {{accent}}">{{w.d}}</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 20px; line-height: 1">{{w.n}}</span>
</button>
</sc-if>
<sc-if value="{{w.notSel}}" hint-placeholder-val="{{ true }}">
<button aria-label="Day {{w.n}}" style="height: 56px; border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{w.d}}</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 20px; line-height: 1">{{w.n}}</span>
</button>
</sc-if>
</sc-for>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 32px; line-height: 1">990</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">/ 2350 KCAL</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">1360 LEFT</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{kOn}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{kOff}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 10px; border-top: 1px dashed #2e2e2e">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px"><span style="color: #8e8e8e">{{m.label}}</span><span>{{m.val}}/{{m.goal}}</span></span>
<div style="display: flex; gap: 2px">
<sc-for list="{{m.on}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{m.off}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</div>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
<section style="background: #0d0d0d; border: 1px solid #262626; border-radius: 20px; padding: 6px 8px 6px 16px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 500">{{m.name}}</h2>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">{{m.kcal}}</span>
</div>
<a href="FoodSearch.dc.html" aria-label="Add to {{m.name}}" style="width: 44px; height: 44px; border-radius: 22px; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</a>
</div>
<sc-for list="{{m.items}}" as="it">
<a href="FoodDetail.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-top: 1px dashed #262626; padding-right: 10px">
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px">{{it.name}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{it.qty}}</span>
</div>
<span style="font-family: 'Space Mono', monospace; font-size: 13px">{{it.kcal}}</span>
</a>
</sc-for>
</section>
</sc-for>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Plans.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="FoodLog.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Progress.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profile.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const days = [['M', 5], ['T', 6], ['W', 7], ['T', 8], ['F', 9], ['S', 10], ['S', 11]];
return {
accent: this.props.accent ?? '#D71921',
week: days.map(([d, n]) => ({ d, n, sel: n === 8, notSel: n !== 8 })),
kOn: dots(13), kOff: dots(17),
macros: [['PROT', 92, 160], ['CARB', 118, 260], ['FAT', 38, 75]].map(([label, val, goal]) => {
const k = Math.round(10 * Math.min(val / goal, 1));
return { label, val, goal, on: dots(k), off: dots(10 - k) };
}),
meals: [
{ name: 'Breakfast', kcal: '420 kcal', items: [
{ name: 'Greek yogurt 0%', qty: '250 g', kcal: '145' },
{ name: 'Rolled oats', qty: '70 g', kcal: '275' } ] },
{ name: 'Lunch', kcal: '570 kcal', items: [
{ name: 'Basmati rice', qty: '100 g dry', kcal: '350' },
{ name: 'Chicken breast', qty: '200 g', kcal: '220' } ] },
{ name: 'Snack', kcal: '—', items: [] },
{ name: 'Dinner', kcal: '—', items: [] }
]
};
}
}
</script>
</body>
</html>
