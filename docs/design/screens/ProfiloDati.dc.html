<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Privacy and data</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 34px; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Profilo.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 28px; line-height: 1">PRIVACY &amp; DATA</h1>
</div>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">YOUR DATA</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 10px 0 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Download everything</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">ZIP · JSON + CSV + PHOTOS</span></span>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0">EXPORT</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; border-top: 1px dashed #262626">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Workouts only</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">CSV · OPENS IN ANY SPREADSHEET</span></span>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0">EXPORT</button>
</div>
</div>
</section>

<sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{s.title}}</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 12px 0 16px">
<sc-for list="{{s.rows}}" as="n">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-top: {{n.border}}; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{n.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{n.detail}}</span></span>
<input type="checkbox" role="switch" checked="{{n.on}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<sc-if value="{{n.on}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 3px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #000"></span></span></sc-if>
<sc-if value="{{n.off}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; border: 1px solid #8e8e8e; background: #000; display: flex; align-items: center; padding: 2px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #8e8e8e"></span></span></sc-if>
</label>
</sc-for>
</div>
</section>
</sc-for>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 0 10px 0 16px; border-radius: 18px; border: 1px solid #262626; background: #0d0d0d">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">Health data consent</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">GIVEN JUL 16 2026</span></span>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0">WITHDRAW</button>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button style="height: 52px; border-radius: 26px; border: 1px solid {{accent}}; background: transparent; color: #ff6b6b; font-family: inherit; font-size: 15px">Delete account</button>
<span style="text-align: center; color: #8e8e8e; font-size: 13px; line-height: 1.45">Removes all your data and photos within 30 days. This can't be undone.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const n = (name, detail, on, first) => ({ name, detail, on, off: !on, border: first ? 'none' : '1px dashed #262626' });
return {
accent: this.props.accent ?? '#D71921',
sections: [
{ title: 'PROGRESS PHOTOS', rows: [
n('Blur photos until tapped', 'SAFE TO OPEN THE APP IN PUBLIC', true, true),
n('Lock photos', 'FACE ID OR PASSCODE TO VIEW', true, false) ] },
{ title: 'SHARING', rows: [
n('Anonymous usage stats', 'HELPS US FIX BUGS · NO HEALTH DATA', false, true),
n('Share with a coach', 'PREMIUM · NOBODY HAS ACCESS NOW', false, false) ] }
]
};
}
}
</script>
</body>
</html>
