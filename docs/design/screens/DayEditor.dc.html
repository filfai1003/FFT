<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="PlanDetail.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PPL 4-DAY · DAY 2</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">DAY NAME</span>
<input type="text" value="Push A" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 16px; font-family: 'Doto', monospace; font-weight: 800; font-size: 24px">
</label>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">EXERCISES · 6</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">HOLD TO REORDER</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{before}}" as="e" hint-placeholder-count="1">
<button style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 14px 0 8px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{e.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{e.info}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
</sc-for>

<section style="border-radius: 18px; border: 1px solid #fff; background: #111; padding: 10px 14px 14px 8px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<span style="flex: 1; font-size: 15px; font-weight: 500">Incline dumbbell press</span>
<button aria-label="Remove exercise" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-left: 26px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">SETS</span>
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 12px; border: 1px solid #6e6e6e; background: #000">
<button aria-label="Fewer sets" style="width: 32px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">−</button>
<span style="font-family: 'Space Mono', monospace; font-size: 15px">4</span>
<button aria-label="More sets" style="width: 32px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">+</button>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">REPS</span>
<input type="text" value="8–10" style="height: 44px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #6e6e6e; background: #000; color: #f2f2f2; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px">
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">REST</span>
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 12px; border: 1px solid #6e6e6e; background: #000">
<button aria-label="Less rest" style="width: 28px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">−</button>
<span style="font-family: 'Space Mono', monospace; font-size: 14px">2:00</span>
<button aria-label="More rest" style="width: 28px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">+</button>
</div>
</div>
</div>
<label style="display: block; padding-left: 26px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note</span>
<input type="text" placeholder="Note (e.g. bench at 30°)" style="height: 40px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #262626; background: transparent; color: #f2f2f2; padding: 0 12px; font-family: inherit; font-size: 16px">
</label>
</section>

<sc-for list="{{after}}" as="e" hint-placeholder-count="4">
<button style="display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 14px 0 8px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/></svg>
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{e.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{e.info}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
</sc-for>
</div>

<a href="ExercisePicker.dc.html" style="margin-top: auto; text-decoration: none; height: 52px; border-radius: 26px; border: 1px dashed #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em">+ ADD EXERCISE</a>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="PlanDetail.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save day</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
before: [{ name: 'Barbell bench press', info: '4 × 6–8 · REST 2:30' }],
after: [
{ name: 'Cable fly', info: '3 × 12 · REST 1:00' },
{ name: 'Seated DB shoulder press', info: '3 × 8–10 · REST 2:00' }
]
};
}
}
</script>
</body>
</html>
