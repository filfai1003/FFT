<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create food</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 16px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="FoodSearch.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NEW FOOD</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NAME</span>
<input type="text" value="Homemade protein bar" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #fff; background: #111; color: #f2f2f2; padding: 0 16px; font-family: inherit; font-size: 17px">
</label>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">BRAND · OPTIONAL</span>
<input type="text" placeholder="—" style="height: 48px; box-sizing: border-box; width: 100%; border-radius: 14px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 14px; font-family: inherit; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">BARCODE</span>
<span style="display: flex; align-items: center; height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #6e6e6e; background: #111; padding: 0 6px 0 14px; gap: 6px">
<input type="text" value="8001234567890" style="flex: 1; min-width: 0; border: none; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 16px">
<a href="Scanner.dc.html" aria-label="Scan barcode" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; color: #f2f2f2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></a>
</span>
</label>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NUTRITION PER 100 G · FROM THE LABEL</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="8">
<label style="display: flex; align-items: center; justify-content: space-between; height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #262626; background: #0d0d0d; padding: 0 12px 0 14px; gap: 8px">
<span style="font-size: 13px; color: {{f.color}}">{{f.name}}</span>
<span style="display: flex; align-items: baseline; gap: 4px"><input type="text" inputmode="decimal" value="{{f.val}}" style="width: 44px; border: none; background: transparent; color: #f2f2f2; text-align: right; font-family: 'Space Mono', monospace; font-size: 16px"><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{f.unit}}</span></span>
</label>
</sc-for>
</div>
</fieldset>

<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PORTIONS</legend>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 6px 0 14px; border-radius: 14px; border: 1px solid #262626; background: #0d0d0d">
<span style="font-size: 14px">1 bar</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="font-family: 'Space Mono', monospace; font-size: 13px">45 g</span><button aria-label="Remove portion" style="width: 44px; height: 44px; border: none; background: transparent; color: #8e8e8e"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
</div>
<button style="height: 44px; border-radius: 22px; border: 1px dashed #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">+ ADD PORTION</button>
</fieldset>

<span style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8e8e8e">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
Only visible to you. You'll find it under Mine.</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="FoodDetail.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save food</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const f = (name, val, unit, sub) => ({ name, val, unit, color: sub ? '#8e8e8e' : '#fff' });
return {
accent: this.props.accent ?? '#D71921',
fields: [
f('Energy', '390', 'kcal', false), f('Protein', '30', 'g', false),
f('Carbs', '38', 'g', false), f('Sugars', '12', 'g', true),
f('Fat', '12', 'g', false), f('Saturates', '3', 'g', true),
f('Fiber', '6', 'g', false), f('Salt', '0.3', 'g', false)
]
};
}
}
</script>
</body>
</html>
