<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adjust a fixed meal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; overflow: hidden">

<div aria-hidden="true" style="opacity: 0.3; padding: 28px 20px; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8e8e8e">THU OCT 08</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">FOOD LOG</span>
<span style="height: 44px; border-radius: 22px; border: 1px solid #262626"></span>
<span style="height: 150px; border-radius: 24px; background: #111; border: 1px solid #262626"></span>
<span style="height: 84px; border-radius: 20px; border: 1px solid #262626"></span>
<span style="height: 84px; border-radius: 20px; border: 1px solid #262626"></span>
</div>

<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(0, 0, 0, 0.6)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="meal-title" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #111; border-top: 1px solid #6e6e6e; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #444"></span>
<div style="display: flex; flex-direction: column; gap: 6px">
<h2 id="meal-title" style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 30px; line-height: 1">LUNCH</h2>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">PLANNED · 750 KCAL · P 50 · C 90 · F 18</span>
</div>

<div role="radiogroup" aria-label="What did you eat" style="display: flex; flex-direction: column; gap: 8px">
<button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left; font-size: 15px">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid #6e6e6e; flex-shrink: 0"></span>Ate it as planned</button>

<div role="radio" aria-checked="true" tabindex="0" style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: 16px; border: 1px solid #fff; background: #161616">
<span style="display: flex; align-items: center; gap: 12px; font-size: 15px"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 5px solid #fff; flex-shrink: 0"></span>Ate a different amount</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">{{f.label}}</span>
<input type="text" inputmode="numeric" value="{{f.val}}" style="height: 44px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #6e6e6e; background: #000; color: #f2f2f2; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px">
</label>
</sc-for>
</div>
</div>

<a href="Cerca.dc.html" style="text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px 0 16px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-size: 15px">
<span style="display: flex; align-items: center; gap: 12px"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid #6e6e6e; flex-shrink: 0"></span>Log the foods instead</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>

<button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left; font-size: 15px">
<span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid #6e6e6e; flex-shrink: 0"></span>Skipped this meal</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<a href="DiarioPiano.dc.html" style="text-decoration: none; height: 54px; border-radius: 27px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px">Save for today</a>
<span style="text-align: center; color: #8e8e8e; font-size: 13px; line-height: 1.45">Only changes today. Your plan stays the same.</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
fields: [{ label: 'KCAL', val: 900 }, { label: 'PROT', val: 45 }, { label: 'CARB', val: 110 }, { label: 'FAT', val: 28 }]
};
}
}
</script>
</body>
</html>
