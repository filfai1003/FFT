<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Libreria.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<button aria-label="More options" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
</button>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<dc-import name="ExerciseIcon" src="" size="72" hint-size="72px,72px"></dc-import>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<h1 style="margin: 0; font-size: 24px; font-weight: 500; line-height: 1.15">Barbell bench press</h1>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e; line-height: 1.5">CHEST · SHOULDERS · TRICEPS · BARBELL</span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">ACTUAL MAX</span>
<span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 36px; line-height: 1">80</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">KG</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">HEAVIEST LOGGED · 80 × 5</span>
</div>
<div style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">ESTIMATED 1RM</span>
<span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 36px; line-height: 1">93</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">KG</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">EPLEY · FROM 80 × 5</span>
</div>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div role="radiogroup" aria-label="Chart metric" style="display: flex; gap: 4px; padding: 3px; border-radius: 16px; border: 1px solid #262626">
<button role="radio" aria-checked="true" style="height: 44px; padding: 0 10px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">EST. 1RM</button>
<button role="radio" aria-checked="false" style="height: 44px; padding: 0 10px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">ACTUAL MAX</button>
</div>
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>+7 KG · 8 WK</span>
</div>
<div role="img" aria-label="Estimated one-rep max rising from 86 to 93 kg over 8 weeks" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<sc-for list="{{col.off}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #222"></span></sc-for>
<sc-for list="{{col.on}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #fff"></span></sc-for>
<span style="margin-top: 4px; font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{col.v}}</span>
</div>
</sc-for>
</div>
</div>

<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">RECENT SESSIONS</h2>
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="2">
<a href="SessioneDettaglio.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px dashed #262626">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px">{{s.date}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{s.sets}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</section>

<button style="display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 16px; border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; font-size: 15px">
How to perform
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const vals = [86, 87, 88, 88, 90, 91, 92, 93];
return {
accent: this.props.accent ?? '#D71921',
cols: vals.map((v) => {
const on = Math.max(1, Math.round(((v - 80) / 13) * 10));
return { v, on: dots(on), off: dots(10 - on) };
}),
sessions: [
{ date: 'Thu Oct 1 · Push A', sets: '80×5 · 80×5 · 75×6 · 75×6' },
{ date: 'Fri Sep 25 · Push A', sets: '77.5×5 · 77.5×5 · 75×6 · 72.5×7' }
]
};
}
}
</script>
</body>
</html>
