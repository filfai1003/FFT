<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 16px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Schede.dc.html" aria-label="Minimize session (keeps running)" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PUSH A · IN PROGRESS</span>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 26px; line-height: 1">00:32:14</span>
</div>
<a href="SessioneFine.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; font-weight: 500; font-size: 14px">Finish</a>
</div>

<div style="display: flex; gap: 4px; align-items: center">
<sc-for list="{{progDone}}" as="d"><span style="flex: 1; height: 4px; border-radius: 2px; background: #fff"></span></sc-for>
<span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
<sc-for list="{{progTodo}}" as="d"><span style="flex: 1; height: 4px; border-radius: 2px; background: #2a2a2a"></span></sc-for>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<dc-import name="ExerciseIcon" kind="dumbbell" size="52" hint-size="52px,52px"></dc-import>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">EXERCISE 3/6</span>
<h1 style="margin: 0; font-size: 22px; font-weight: 500; line-height: 1.15">Incline dumbbell press</h1>
</div>
<a href="EsercizioDettaglio.dc.html" aria-label="Exercise details" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
</a>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 8px 14px">
<div style="display: grid; grid-template-columns: 34px 1fr 70px 60px 48px; gap: 8px; align-items: center; padding: 8px 0; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">
<span>SET</span><span>PREVIOUS</span><span>KG</span><span>REPS</span><span></span>
</div>
<sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 34px 1fr 70px 60px 48px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px dashed #2a2a2a">
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 20px">{{s.n}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">{{s.prev}}</span>
<label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set {{s.n}} weight</span><input type="text" inputmode="decimal" value="{{s.kg}}" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 12px; border: 1px solid #6e6e6e; background: #000; color: #f2f2f2; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px"></label>
<label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set {{s.n}} reps</span><input type="text" inputmode="numeric" value="{{s.reps}}" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 12px; border: 1px solid #6e6e6e; background: #000; color: #f2f2f2; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px"></label>
<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}">
<button aria-label="Set {{s.n}} done" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #fff; color: #000; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
</button>
</sc-if>
<sc-if value="{{s.todo}}" hint-placeholder-val="{{ false }}">
<button aria-label="Mark set {{s.n}} as done" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
</button>
</sc-if>
</div>
</sc-for>
<button style="width: 100%; height: 44px; margin-top: 4px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em">+ ADD SET</button>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>REST · 02:00</span>
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">SKIP</button>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Minus 15 seconds" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 13px">-15</button>
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 60px; line-height: 1">01:24</span>
<button aria-label="Plus 15 seconds" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 13px">+15</button>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{restOn}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{restOff}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</div>
</div>

<div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 106px; min-height: 52px; box-sizing: border-box; padding: 4px 4px 4px 16px; border-radius: 26px; border: 1px solid #6e6e6e; background: #1c1c1c; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>Set 2 saved · rest started</span>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-decoration: underline">UNDO</button>
</div>
<nav aria-label="Switch exercise" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="min-height: 60px; padding: 10px 14px; border-radius: 20px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; gap: 10px; text-align: left; font-family: inherit">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M15 6l-6 6 6 6"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PREVIOUS</span><span style="font-size: 14px; font-weight: 500">Bench press</span></span>
</button>
<button style="min-height: 60px; padding: 10px 14px; border-radius: 20px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: flex-end; gap: 10px; text-align: right; font-family: inherit">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NEXT</span><span style="font-size: 14px; font-weight: 500">Cable fly</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const set = (n, prev, kg, reps, done) => ({ n, prev, kg, reps, done, todo: !done });
return {
accent: this.props.accent ?? '#D71921',
progDone: dots(2), progTodo: dots(3),
sets: [set(1, '24 × 10', '26', '10', true), set(2, '24 × 9', '26', '9', true), set(3, '24 × 8', '26', '', false), set(4, '22 × 8', '24', '', false)],
restOn: dots(14), restOff: dots(10)
};
}
}
</script>
</body>
</html>
