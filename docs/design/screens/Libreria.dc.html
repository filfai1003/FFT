<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Schede.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<a href="CreaEsercizio.dc.html" aria-label="Create exercise" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</a>
</div>

<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">LIBRARY</h1>

<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 26px; background: #111; border: 1px solid #6e6e6e">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
<input type="search" placeholder="Search exercises" style="flex: 1; min-width: 0; border: none; background: transparent; color: #f2f2f2; font-family: inherit; font-size: 16px; outline: none">
</label>

<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -20px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button style="flex-shrink: 0; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.06em">{{c.label}}</button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 4px; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{g.title}}</h2>
<sc-for list="{{g.items}}" as="e">
<a href="EsercizioDettaglio.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px dashed #262626">
<dc-import name="ExerciseIcon" src="" size="40" hint-size="40px,40px"></dc-import>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px">{{e.name}}<sc-if value="{{e.mine}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 2px 6px; border-radius: 8px; border: 1px solid #6e6e6e; color: #ccc">MINE</span></sc-if></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{e.info}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</section>
</sc-for>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const c = (label, on) => ({ label, on, off: !on });
return {
accent: this.props.accent ?? '#D71921',
chips: [c('ALL', true), c('CHEST', false), c('BACK', false), c('SHOULDERS', false), c('LEGS', false), c('MINE', false)],
groups: [
{ title: 'CHEST', items: [
{ name: 'Barbell bench press', info: 'MAX 80 KG · EST. 1RM 93 KG', mine: false },
{ name: 'Incline dumbbell press', info: 'MAX 26 KG · EST. 1RM 35 KG', mine: false },
{ name: 'Incline Smith press', info: 'NOT LOGGED YET', mine: true } ] },
{ title: 'BACK', items: [
{ name: 'Pull-ups', info: 'BEST 10 REPS', mine: false },
{ name: 'Barbell row', info: 'MAX 70 KG · EST. 1RM 89 KG', mine: false },
{ name: 'Lat pulldown', info: 'MAX 65 KG · EST. 1RM 82 KG', mine: false } ] }
]
};
}
}
</script>
</body>
</html>
