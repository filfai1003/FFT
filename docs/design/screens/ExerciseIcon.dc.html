<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="width: {{w}}; height: {{w}}; box-sizing: border-box; border-radius: {{r}}; background: #161616; border: {{border}}; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #666; flex-shrink: 0; font-family: sans-serif">
<sc-if value="{{hasSrc}}" hint-placeholder-val="{{ false }}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
<sc-if value="{{noSrc}}" hint-placeholder-val="{{ true }}"><svg width="{{s}}" height="{{s}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"src":{"editor":"text","default":""},"size":{"editor":"int","min":24,"max":240,"default":96},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
renderVals() {
const size = Number(this.props.size ?? 96);
const src = this.props.src ?? '';
const has = !!src;
return {
src, hasSrc: has, noSrc: !has,
w: size + 'px', s: Math.round(size * 0.4), r: Math.round(size * 0.28) + 'px',
border: has ? '1px solid #333' : '1px dashed #444'
};
}
}
</script>
</body>
</html>
