<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixed meals editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="FoodLogFixed.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">FIXED MEALS</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PLAN NAME</span>
<input type="text" value="Autumn bulk" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 16px; font-family: 'Doto', monospace; font-weight: 800; font-size: 22px">
</label>

<div style="background: #111; border: 1px solid #262626; border-radius: 20px; padding: 12px 14px 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #ccc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>MATCHES YOUR DAILY TARGET</span>
<span style="font-family: 'Space Mono', monospace; font-size: 12px">2350 KCAL · P 160 · C 260 · F 75</span>
</span>
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em; flex-shrink: 0">AUTO-SPLIT</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px 0 16px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Breakfast</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">500 KCAL · P 35 · C 60 · F 12</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>

<section style="border-radius: 18px; border: 1px solid #fff; background: #111; padding: 12px 14px 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Meal name</span><input type="text" value="Lunch" style="width: 100%; border: none; background: transparent; color: #f2f2f2; font-family: inherit; font-size: 16px; font-weight: 500"></label>
<button aria-label="Delete meal" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #8e8e8e; display: flex; align-items: center; justify-content: center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">{{f.label}}</span>
<input type="text" inputmode="numeric" value="{{f.val}}" style="height: 44px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #6e6e6e; background: #000; color: #f2f2f2; text-align: center; font-family: 'Space Mono', monospace; font-size: 16px">
</label>
</sc-for>
</div>
<label style="display: block">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">What you eat</span>
<input type="text" value="Rice, chicken, vegetables, olive oil" style="height: 40px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #262626; background: transparent; color: #f2f2f2; padding: 0 12px; font-family: inherit; font-size: 16px">
</label>
</section>

<sc-for list="{{meals}}" as="m" hint-placeholder-count="2">
<button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px 0 16px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; color: #f2f2f2; font-family: inherit; text-align: left">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{m.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{m.info}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</button>
</sc-for>
</div>

<button style="margin-top: auto; height: 52px; border-radius: 26px; border: 1px dashed #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.08em">+ ADD MEAL</button>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="FoodLogFixed.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save plan</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
fields: [{ label: 'KCAL', val: 750 }, { label: 'PROT', val: 50 }, { label: 'CARB', val: 90 }, { label: 'FAT', val: 18 }],
meals: [
{ name: 'Snack', info: '300 KCAL · P 25 · C 30 · F 8' },
{ name: 'Dinner', info: '800 KCAL · P 50 · C 80 · F 37' }
]
};
}
}
</script>
</body>
</html>
