<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Schede.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<button aria-label="More options: duplicate, archive, delete" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h.01M12 12h.01M18 12h.01"/></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{accent}}"></span>ACTIVE · 4 DAYS · CYCLE 3</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">PPL 4-DAY</h1>
<span style="font-size: 14px; color: #8e8e8e">Hypertrophy · any day can be trained at any time</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<section style="border-radius: 20px; border: 1px solid {{d.border}}; background: {{d.bg}}; padding: 12px 8px 12px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 22px; width: 24px; flex-shrink: 0">{{d.n}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 16px; font-weight: 500">{{d.name}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8e8e8e">{{d.tag}}</span>
<span style="font-size: 13px; color: #8e8e8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.preview}}</span>
</span>
<a href="EditorScheda.dc.html" aria-label="Edit {{d.name}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
</a>
<sc-if value="{{d.notNext}}" hint-placeholder-val="{{ true }}">
<a href="Sessione.dc.html" aria-label="Start {{d.name}} now" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg>
</a>
</sc-if>
</div>
<sc-if value="{{d.isNext}}" hint-placeholder-val="{{ false }}">
<a href="Sessione.dc.html" style="text-decoration: none; margin-right: 8px; height: 48px; border-radius: 24px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 15px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z"/></svg>Start {{d.name}}</a>
</sc-if>
</section>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="EditorScheda.dc.html" style="text-decoration: none; height: 48px; border-radius: 24px; border: 1px dashed #6e6e6e; color: #ccc; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">+ ADD DAY</a>
<a href="Sessione.dc.html" style="text-decoration: none; height: 48px; border-radius: 24px; border: 1px solid #6e6e6e; color: #ccc; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">EMPTY WORKOUT</a>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const day = (n, name, tag, preview, isNext) => ({ n, name, tag, preview, isNext, notNext: !isNext, border: isNext ? '#fff' : '#262626', bg: isNext ? '#111' : '#0d0d0d' });
return {
accent: this.props.accent ?? '#D71921',
days: [
day(1, 'Pull A', 'DONE · MON', 'Pull-ups, barbell row, lat pulldown, curls', false),
day(2, 'Push A', 'UP NEXT', 'Bench press, incline DB press, +4', true),
day(3, 'Legs', 'DONE · WED · OUT OF ORDER', 'Squat, Romanian deadlift, leg press, +3', false),
day(4, 'Upper', 'THIS CYCLE', 'Overhead press, one-arm DB row, +4', false)
]
};
}
}
</script>
</body>
</html>
