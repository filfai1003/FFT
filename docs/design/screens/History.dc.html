<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Plans.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
</div>

<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">HISTORY</h1>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #f2f2f2; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em">OCTOBER 2026</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">4 WORKOUTS</span></span>
<button aria-label="Next month" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #555; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{wd}}" as="w" hint-placeholder-count="7"><span style="text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e; padding-bottom: 4px">{{w}}</span></sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<div style="height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: {{c.numColor}}">{{c.n}}</span>
<span style="width: 9px; height: 9px; box-sizing: border-box; border-radius: 5px; background: {{c.bg}}; border: {{c.ring}}"></span>
</div>
</sc-for>
</div>
</div>

<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">SESSIONS</h2>
<sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
<a href="SessionDetail.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; align-items: center; gap: 14px; min-height: 60px; border-bottom: 1px dashed #262626">
<span style="display: flex; flex-direction: column; align-items: center; width: 36px"><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{s.dow}}</span><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 22px; line-height: 1">{{s.d}}</span></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px">{{s.name}}<sc-if value="{{s.swap}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 8px; border: 1px dashed #666; color: #ccc">OUT OF ORDER</span></sc-if></span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{s.info}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e8e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</section>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Plans.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="FoodLog.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progress.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profile.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#D71921';
const trained = [1, 3, 5, 7];
const today = 8;
const cells = [];
for (let i = 0; i < 3; i++) cells.push({ n: '', numColor: 'transparent', bg: 'transparent', ring: 'none' });
for (let d = 1; d <= 31; d++) {
const isT = trained.includes(d), isToday = d === today, future = d > today;
cells.push({
n: d,
numColor: future ? '#444' : (isToday ? '#fff' : '#8e8e8e'),
bg: isT ? '#fff' : (future ? 'transparent' : '#2a2a2a'),
ring: isToday ? '2px solid ' + accent : (future ? '1px solid #2a2a2a' : 'none')
});
}
cells.push({ n: '', numColor: 'transparent', bg: 'transparent', ring: 'none' });
return {
accent,
wd: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
cells,
sessions: [
{ dow: 'WED', d: '07', name: 'Legs', swap: true, info: '62 MIN · 9.8 T · 20 SETS' },
{ dow: 'MON', d: '05', name: 'Pull A', swap: false, info: '54 MIN · 7.9 T · 21 SETS' },
{ dow: 'SAT', d: '03', name: 'Upper', swap: false, info: '61 MIN · 8.4 T · 24 SETS' }
]
};
}
}
</script>
</body>
</html>
