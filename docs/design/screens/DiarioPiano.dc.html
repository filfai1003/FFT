<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food log – fixed meals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 12px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #8e8e8e">THU OCT 08</span>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">FOOD LOG</h1>
</div>
<div style="display: flex; gap: 8px">
<a href="ObiettiviDieta.dc.html" aria-label="Goals and tracking mode" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
</a>
<button aria-label="Open calendar" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
</button>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 4px 0 16px; border-radius: 22px; border: 1px solid #262626; background: #0d0d0d">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: #fff"></span>PLAN: AUTUMN BULK</span>
<a href="PianoPastiEditor.dc.html" style="text-decoration: none; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">EDIT</a>
</div>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 32px; line-height: 1">{{kcal}}</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">/ 2350 KCAL</span></span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">MEALS {{doneCount}}/4</span>
</div>
<div style="display: flex; gap: 3px">
<sc-for list="{{kOn}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{kOff}}" as="d"><span style="flex: 1; height: 6px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 10px; border-top: 1px dashed #2e2e2e">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 11px"><span style="color: #8e8e8e">{{m.label}}</span><span>{{m.val}}/{{m.goal}}</span></span>
<div style="display: flex; gap: 2px">
<sc-for list="{{m.on}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{m.off}}" as="d"><span style="flex: 1; height: 5px; border-radius: 3px; background: #2a2a2a"></span></sc-for>
</div>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
<section style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 20px; border: 1px solid {{m.border}}; background: #0d0d0d">
<a href="PastoModifica.dc.html" aria-label="Adjust {{m.name}}" style="flex: 1; min-width: 0; text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; gap: 3px">
<div style="display: flex; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 500; color: {{m.nameColor}}">{{m.name}}</h2>
<sc-if value="{{m.isNext}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 5px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e"><span style="width: 5px; height: 5px; border-radius: 3px; background: {{accent}}"></span>UP NEXT</span></sc-if>
<sc-if value="{{m.done}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">DONE</span></sc-if>
</div>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{m.kcal}} KCAL · P {{m.p}} · C {{m.c}} · F {{m.g}}</span>
<span style="font-size: 13px; color: #8e8e8e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.desc}}</span>
</a>
<sc-if value="{{m.done}}" hint-placeholder-val="{{ false }}">
<button onClick="{{m.toggle}}" aria-label="{{m.name}} done, tap to undo" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: 1px solid #fff; background: #161616; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
</button>
</sc-if>
<sc-if value="{{m.todo}}" hint-placeholder-val="{{ true }}">
<button onClick="{{m.toggle}}" aria-label="Mark {{m.name}} as done" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; border: 1px dashed #6e6e6e; background: transparent; color: #555; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>
</button>
</sc-if>
</section>
</sc-for>
</div>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="DiarioPiano.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { done: { 0: true, 1: true, 2: false, 3: false } };
}
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const plan = [
{ name: 'Breakfast', kcal: 500, p: 35, c: 60, g: 12, desc: 'Greek yogurt, oats, berries' },
{ name: 'Lunch', kcal: 750, p: 50, c: 90, g: 18, desc: 'Rice, chicken, vegetables, olive oil' },
{ name: 'Snack', kcal: 300, p: 25, c: 30, g: 8, desc: 'Fruit and protein shake' },
{ name: 'Dinner', kcal: 800, p: 50, c: 80, g: 37, desc: 'Fish, potatoes, salad, olive oil' }
];
const done = this.state.done;
let kcal = 0, p = 0, c = 0, g = 0, count = 0, nextIdx = -1;
plan.forEach((m, i) => {
if (done[i]) { kcal += m.kcal; p += m.p; c += m.c; g += m.g; count++; }
else if (nextIdx < 0) nextIdx = i;
});
const k = Math.round(30 * Math.min(kcal / 2350, 1));
const mac = (label, val, goal) => {
const n = Math.round(10 * Math.min(val / goal, 1));
return { label, val, goal, on: dots(n), off: dots(10 - n) };
};
return {
accent: this.props.accent ?? '#D71921',
kcal, doneCount: count,
kOn: dots(k), kOff: dots(30 - k),
macros: [mac('PROT', p, 160), mac('CARB', c, 260), mac('FAT', g, 75)],
meals: plan.map((m, i) => ({
...m,
done: !!done[i], todo: !done[i], isNext: i === nextIdx,
border: i === nextIdx ? '#444' : '#262626',
nameColor: done[i] ? '#8e8e8e' : '#fff',
toggle: () => this.setState({ done: { ...this.state.done, [i]: !this.state.done[i] } })
}))
};
}
}
</script>
</body>
</html>
