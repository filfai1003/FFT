<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body fat and measurements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 100px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Progressi.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<a href="CheckIn.dc.html" aria-label="Log measurements" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</a>
</div>

<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">BODY FAT</h1>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 48px; line-height: 1">16.8</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">%</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: 'Space Mono', monospace; font-size: 11px"><span>−2.1 PTS</span><span style="color: #8e8e8e">SINCE JUL 16</span></span>
</div>
<div role="img" aria-label="Body fat going down from 18.9 to 16.8 percent over 12 weeks" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
<sc-for list="{{c.off}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #222"></span></sc-for>
<sc-for list="{{c.on}}" as="d"><span style="width: 7px; height: 7px; border-radius: 4px; background: #fff"></span></sc-for>
</div>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding-top: 10px; border-top: 1px dashed #2e2e2e">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 20px; line-height: 1">65.2 KG</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8e8e8e">LEAN MASS · +0.4</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 20px; line-height: 1">13.2 KG</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #8e8e8e">FAT MASS · −2.1</span></span>
</div>
</div>

<fieldset style="border: none; margin: 0; padding: 0">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">MEASURED WITH · KEEP IT THE SAME</legend>
<div style="display: flex; gap: 8px">
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px">SMART SCALE</button>
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 11px">CALIPERS</button>
<button style="height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: 'Space Mono', monospace; font-size: 11px">TAPE ESTIMATE</button>
</div>
</fieldset>

<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 2px; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">MEASUREMENTS · CHANGE SINCE JUL 16</h2>
<sc-for list="{{meas}}" as="m" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px dashed #262626">
<span style="font-size: 14px">{{m.n}}</span>
<span style="display: flex; align-items: center; gap: 14px; font-family: 'Space Mono', monospace; font-size: 13px"><span style="color: #8e8e8e; font-size: 11px">{{m.d}}</span>{{m.v}} cm</span>
</div>
</sc-for>
</section>

<nav aria-label="Main navigation" style="position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #262626; background: #000; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 34px">
<a href="Main.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TODAY</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Schede.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">TRAIN</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Diario.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 0-3 3-3 6s1 4 3 4v8"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">DIET</span>
<span style="width: 4px; height: 4px"></span>
</a>
<a href="Progressi.dc.html" style="text-decoration: none; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROGRESS</span>
<span style="width: 4px; height: 4px; border-radius: 2px; background: {{accent}}"></span>
</a>
<a href="Profilo.dc.html" style="text-decoration: none; color: #8e8e8e; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">PROFILE</span>
<span style="width: 4px; height: 4px"></span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const bf = [18.9, 18.8, 18.6, 18.4, 18.2, 18.0, 17.8, 17.6, 17.4, 17.2, 17.0, 16.8];
return {
accent: this.props.accent ?? '#D71921',
cols: bf.map((v) => {
const on = Math.max(1, Math.round(((v - 16.5) / 2.4) * 7) + 1);
return { on: dots(on), off: dots(8 - on) };
}),
meas: [
{ n: 'Waist', v: '82.5', d: '−3.5' },
{ n: 'Hips', v: '96.0', d: '−1.5' },
{ n: 'Chest', v: '102.0', d: '+1.0' },
{ n: 'Arm', v: '36.5', d: '+0.5' },
{ n: 'Thigh', v: '58.0', d: '0.0' }
]
};
}
}
</script>
</body>
</html>
