<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipe editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 14px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Recipes.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">RECIPE</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NAME</span>
<input type="text" value="Chicken rice bowl" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 16px; font-family: inherit; font-size: 17px">
</label>

<div style="background: #111; border: 1px solid #262626; border-radius: 24px; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PER SERVING</span>
<span style="display: flex; align-items: baseline; gap: 6px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">534</span><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">KCAL</span></span>
</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">SERVINGS</span>
<div style="display: flex; align-items: center; height: 40px; border-radius: 20px; border: 1px solid #6e6e6e; background: #000">
<button aria-label="Fewer servings" style="width: 44px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">−</button>
<span style="font-family: 'Space Mono', monospace; font-size: 15px; min-width: 18px; text-align: center">4</span>
<button aria-label="More servings" style="width: 44px; height: 44px; border: none; background: transparent; color: #f2f2f2; font-size: 16px">+</button>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 10px; border-top: 1px dashed #2e2e2e; font-family: 'Space Mono', monospace; font-size: 12px">
<span><span style="color: #8e8e8e">P </span>44 g</span><span><span style="color: #8e8e8e">C </span>66 g</span><span><span style="color: #8e8e8e">F </span>11 g</span>
</div>
</div>

<section style="display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 2px 4px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">INGREDIENTS · WHOLE RECIPE</h2>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">2135 KCAL</span>
</div>
<sc-for list="{{items}}" as="i" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px dashed #262626">
<span style="flex: 1; font-size: 14px">{{i.name}}</span>
<label style="display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 10px; border-radius: 12px; border: 1px solid #6e6e6e; background: #0d0d0d">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{i.name}} grams</span>
<input type="text" inputmode="numeric" value="{{i.g}}" style="width: 36px; border: none; background: transparent; color: #f2f2f2; text-align: right; font-family: 'Space Mono', monospace; font-size: 16px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">g</span>
</label>
<span style="width: 48px; text-align: right; font-family: 'Space Mono', monospace; font-size: 12px; color: #ccc">{{i.kcal}}</span>
</div>
</sc-for>
<a href="FoodSearch.dc.html" style="text-decoration: none; margin-top: 10px; height: 44px; border-radius: 22px; border: 1px dashed #6e6e6e; color: #ccc; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.08em">+ ADD INGREDIENT</a>
</section>

<a href="FoodDetail.dc.html" style="margin-top: auto; text-decoration: none; height: 52px; border-radius: 26px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px">Log a serving</a>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="Recipes.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save recipe</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
accent: this.props.accent ?? '#D71921',
items: [
{ name: 'Basmati rice, dry', g: 300, kcal: 1050 },
{ name: 'Chicken breast', g: 600, kcal: 660 },
{ name: 'Broccoli', g: 400, kcal: 136 },
{ name: 'Olive oil', g: 30, kcal: 265 },
{ name: 'Soy sauce', g: 40, kcal: 24 }
]
};
}
}
</script>
</body>
</html>
