<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Barcode scanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #050505; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 276px; gap: 20px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Cerca.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #ccc">SCAN · ADD TO LUNCH</span>
<button aria-label="Turn on flashlight" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-2 6v12H9V9z"/><path d="M12 13v3"/></svg>
</button>
</div>

<div aria-label="Camera view" style="position: relative; height: 330px; border-radius: 28px; border: 1px solid #1f1f1f; background-color: #0a0a0a; background-image: radial-gradient(#1a1a1a 1px, transparent 1px); background-size: 10px 10px; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: 270px; height: 160px">
<span style="position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-left: 3px solid #fff; border-top: 3px solid #fff; border-top-left-radius: 14px"></span>
<span style="position: absolute; right: 0; top: 0; width: 28px; height: 28px; border-right: 3px solid #fff; border-top: 3px solid #fff; border-top-right-radius: 14px"></span>
<span style="position: absolute; left: 0; bottom: 0; width: 28px; height: 28px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; border-bottom-left-radius: 14px"></span>
<span style="position: absolute; right: 0; bottom: 0; width: 28px; height: 28px; border-right: 3px solid #fff; border-bottom: 3px solid #fff; border-bottom-right-radius: 14px"></span>
<span style="position: absolute; left: 18px; right: 18px; top: 79px; height: 2px; border-radius: 1px; background: {{accent}}"></span>
</div>
</div>

<span style="align-self: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e">POINT THE CAMERA AT THE BARCODE</span>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #111; border-top: 1px solid #6e6e6e; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #444"></span>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8e8e8e"><span style="width: 6px; height: 6px; border-radius: 3px; background: #fff"></span>FOUND · 8 001234 567890</div>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 18px; font-weight: 500">Skyr, plain 0% fat</span>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">PER 100 G · P 11 · C 4 · F 0.2</span>
</div>
<span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 32px; line-height: 1">63</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">KCAL</span></span>
</div>
<a href="AlimentoDettaglio.dc.html" style="text-decoration: none; height: 54px; border-radius: 27px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px">Choose amount</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">TYPE THE CODE</button>
<a href="CreaAlimento.dc.html" style="text-decoration: none; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.06em">NOT FOUND? CREATE</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#D71921' };
}
}
</script>
</body>
</html>
