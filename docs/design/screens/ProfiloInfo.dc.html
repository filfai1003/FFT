<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal info</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 112px; gap: 18px; overflow: hidden">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Profilo.dc.html" style="text-decoration: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #6e6e6e; color: #f2f2f2; display: flex; align-items: center; font-size: 14px">Cancel</a>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PERSONAL INFO</span>
<span aria-hidden="true" style="width: 86px"></span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NAME</span>
<input type="text" value="Alex Morgan" style="height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 16px; font-family: inherit; font-size: 17px">
</label>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">BIRTH DATE</span>
<input type="text" value="14 / 03 / 1995" style="height: 48px; box-sizing: border-box; width: 100%; border-radius: 14px; border: 1px solid #6e6e6e; background: #111; color: #f2f2f2; padding: 0 14px; font-family: 'Space Mono', monospace; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">HEIGHT</span>
<span style="display: flex; align-items: center; justify-content: space-between; height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #6e6e6e; background: #111; padding: 0 14px"><input type="text" inputmode="numeric" value="180" style="width: 60px; border: none; background: transparent; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 16px"><span style="font-family: 'Space Mono', monospace; font-size: 12px; color: #8e8e8e">cm</span></span>
</label>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<fieldset style="border: none; margin: 0; padding: 0">
<legend style="padding: 0 0 8px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{g.title}}</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{g.chips}}" as="c">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: inherit; font-size: 14px">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #ccc; font-family: inherit; font-size: 14px">{{c.label}}</button></sc-if>
</sc-for>
</div>
</fieldset>
</sc-for>

<span style="margin-top: auto; display: flex; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid #262626; background: #0d0d0d; font-size: 13px; color: #ccc; line-height: 1.45">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
These are used to calculate your calorie target. If they change, we'll suggest new targets — nothing changes until you accept.</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #000; border-top: 1px solid #262626">
<a href="Profilo.dc.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: {{accent}}; color: #f2f2f2; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 17px">Save changes</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const c = (label, on) => ({ label, on, off: !on });
return {
accent: this.props.accent ?? '#D71921',
groups: [
{ title: 'SEX · FOR THE CALORIE FORMULA', chips: [c('Male', true), c('Female', false)] },
{ title: 'DAILY ACTIVITY OUTSIDE TRAINING', chips: [c('Mostly sitting', false), c('Light', true), c('On my feet', false), c('Physical job', false)] },
{ title: 'TRAINING EXPERIENCE', chips: [c('Beginner', false), c('Intermediate', true), c('Advanced', false)] },
{ title: 'WHERE YOU TRAIN', chips: [c('Full gym', true), c('Home', false), c('Bodyweight only', false)] }
]
};
}
}
</script>
</body>
</html>
