<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 34px; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Profilo.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 34px; line-height: 1">SETTINGS</h1>
</div>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">UNITS</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 8px 0 16px">
<sc-for list="{{units}}" as="u" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; border-top: {{u.border}}">
<span style="font-size: 14px">{{u.name}}</span>
<div role="radiogroup" aria-label="{{u.name}}" style="display: flex; gap: 2px; padding: 2px; border-radius: 15px; border: 1px solid #262626">
<sc-for list="{{u.opts}}" as="o">
<sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><button role="radio" aria-checked="true" style="height: 44px; min-width: 48px; padding: 0 8px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px">{{o.l}}</button></sc-if>
<sc-if value="{{o.off}}" hint-placeholder-val="{{ true }}"><button role="radio" aria-checked="false" style="height: 44px; min-width: 48px; padding: 0 8px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px">{{o.l}}</button></sc-if>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">APPEARANCE</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 8px 0 16px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 0">
<span style="font-size: 14px">Accent color</span>
<div role="radiogroup" aria-label="Accent color" style="display: flex; gap: 12px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
<button role="radio" aria-checked="{{s.sel}}" aria-label="{{s.name}}" style="width: 44px; height: 44px; border-radius: 22px; border: {{s.ring}}; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: 14px; background: {{s.c}}"></span></button>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; border-top: 1px dashed #262626">
<span style="font-size: 14px">Theme</span>
<div role="radiogroup" aria-label="Theme" style="display: flex; gap: 2px; padding: 2px; border-radius: 15px; border: 1px solid #262626">
<button role="radio" aria-checked="true" style="height: 44px; padding: 0 10px; border-radius: 22px; border: 1px solid #fff; background: #161616; color: #f2f2f2; font-family: 'Space Mono', monospace; font-size: 11px">DARK</button>
<button role="radio" aria-checked="false" style="height: 44px; padding: 0 10px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px">LIGHT</button>
<button role="radio" aria-checked="false" style="height: 44px; padding: 0 10px; border-radius: 22px; border: none; background: transparent; color: #8e8e8e; font-family: 'Space Mono', monospace; font-size: 11px">SYSTEM</button>
</div>
</div>
<button style="width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 46px; border: none; border-top: 1px dashed #262626; background: transparent; color: #f2f2f2; padding: 0 6px 0 0; font-family: inherit; font-size: 14px">Language<span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">ENGLISH<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></button>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">NOTIFICATIONS</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 12px 0 16px">
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="4">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-top: {{n.border}}; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{n.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{n.detail}}</span></span>
<input type="checkbox" role="switch" checked="{{n.on}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<sc-if value="{{n.on}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 3px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #000"></span></span></sc-if>
<sc-if value="{{n.off}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; border: 1px solid #8e8e8e; background: #000; display: flex; align-items: center; padding: 2px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #8e8e8e"></span></span></sc-if>
</label>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#D71921';
const opt = (l, on) => ({ l, on, off: !on });
const u = (name, opts, first) => ({ name, opts, border: first ? 'none' : '1px dashed #262626' });
const sw = (name, c) => ({ name, c, sel: c.toLowerCase() === accent.toLowerCase(), ring: c.toLowerCase() === accent.toLowerCase() ? '2px solid #fff' : '1px solid #333' });
const n = (name, detail, on, first) => ({ name, detail, on, off: !on, border: first ? 'none' : '1px dashed #262626' });
return {
accent,
units: [
u('Weight', [opt('KG', true), opt('LB', false)], true),
u('Length', [opt('CM', true), opt('FT·IN', false)], false),
u('Energy', [opt('KCAL', true), opt('KJ', false)], false),
u('Week starts', [opt('MON', true), opt('SUN', false)], false)
],
swatches: [sw('Red', '#D71921'), sw('Orange', '#FF5A1F'), sw('Yellow', '#F2C94C'), sw('Green', '#3DDC84'), sw('Blue', '#4D8CFF'), sw('White', '#FFFFFF')],
notifs: [
n('Rest timer done', 'SOUND + VIBRATION', true, true),
n('Workout reminder', 'TRAINING DAYS · 18:00', true, false),
n('Weekly check-in', 'THURSDAY · 08:00', true, false),
n('Meal reminders', 'OFF', false, false)
]
};
}
}
</script>
</body>
</html>
