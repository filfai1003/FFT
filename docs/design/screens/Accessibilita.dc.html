<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accessibility</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Space+Grotesk:wght@400;500&amp;family=Space+Mono&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff}a:hover{color:#bbb}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background-color: #000; background-image: radial-gradient(#1c1c1c 1px, transparent 1px); background-size: 14px 14px; color: #f2f2f2; font-family: 'Space Grotesk', sans-serif; display: flex; flex-direction: column; padding: 59px 20px 34px; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Profilo.dc.html" aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #6e6e6e; background: #0d0d0d; color: #f2f2f2; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<h1 style="margin: 0; font-family: 'Doto', monospace; font-weight: 800; font-size: 28px; line-height: 1">ACCESSIBILITY</h1>
</div>

<div aria-label="Preview" style="border-radius: 18px; border: 1px solid #262626; background: #111; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">PREVIEW</span><span style="font-size: 15px">Calories left today</span></span>
<span style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Doto', monospace; font-weight: 800; font-size: 40px; line-height: 1">1360</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">KCAL</span></span>
</div>

<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-family: 'Space Mono', monospace; font-weight: 400; font-size: 11px; letter-spacing: 0.12em; color: #8e8e8e">{{s.title}}</h2>
<div style="border-radius: 18px; border: 1px solid #262626; background: #0d0d0d; padding: 0 12px 0 16px">
<sc-if value="{{s.hasSize}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 52px">
<span style="font-size: 14px">Text size</span>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="Smaller text" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-size: 12px">A</button>
<span aria-label="Text size 3 of 5" style="display: flex; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #fff"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #fff"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #fff"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #2a2a2a"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #2a2a2a"></span></span>
<button aria-label="Larger text" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #6e6e6e; background: transparent; color: #f2f2f2; font-size: 18px">A</button>
</div>
</div>
</sc-if>
<sc-for list="{{s.rows}}" as="n">
<label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-top: {{n.border}}; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{n.name}}</span><span style="font-family: 'Space Mono', monospace; font-size: 11px; color: #8e8e8e">{{n.detail}}</span></span>
<input type="checkbox" role="switch" checked="{{n.on}}" style="position: absolute; opacity: 0; width: 1px; height: 1px">
<sc-if value="{{n.on}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: #fff; display: flex; align-items: center; justify-content: flex-end; padding: 3px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #000"></span></span></sc-if>
<sc-if value="{{n.off}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; border: 1px solid #8e8e8e; background: #000; display: flex; align-items: center; padding: 2px"><span style="width: 20px; height: 20px; border-radius: 10px; background: #8e8e8e"></span></span></sc-if>
</label>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const n = (name, detail, on, first) => ({ name, detail, on, off: !on, border: first ? 'none' : '1px dashed #262626' });
return {
accent: this.props.accent ?? '#D71921',
sections: [
{ title: 'TEXT', hasSize: true, rows: [
n('Bold text', 'THICKER BODY TEXT', false, false),
n('Dot-matrix numbers', 'OFF = PLAIN, EASIER-TO-READ DIGITS', true, false) ] },
{ title: 'VISION & MOTION', hasSize: false, rows: [
n('Higher contrast', 'BRIGHTER GREYS AND BORDERS', false, true),
n('Reduce motion', 'NO ANIMATIONS OR TRANSITIONS', false, false),
n('Haptics', 'VIBRATE ON TICKS AND SETS', true, false) ] },
{ title: 'DURING WORKOUTS', hasSize: false, rows: [
n('One-hand mode', 'BIGGER BUTTONS, ACTIONS AT THE BOTTOM', false, true),
n('Spoken rest countdown', 'READS 10 … 3, 2, 1 OUT LOUD', false, false) ] }
]
};
}
}
</script>
</body>
</html>
