<div style="display: flex; gap: 3px">
<sc-for list="{{m.on}}" as="d"><span style="width: 6px; height: 6px; border-radius: 3px; background: #fff"></span></sc-for>
<sc-for list="{{m.off}}" as="d"><span style="width: 6px; height: 6px; border-radius: 3px; background: #2a2a2a"></span></sc-for>

</div>
</sc-for>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D71921","options":["#D71921","#FF5A1F","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dots = (n) => Array.from({ length: n }, (_, i) => ({ i }));
const total = 40, on = Math.round(total * (990 / 2350));
const mac = (label, val, goal) => {
const k = Math.round(10 * Math.min(val / goal, 1));
return { label, val, goal, on: dots(k), off: dots(10 - k) };
};
return {
accent: this.props.accent ?? '#D71921',
kcalOn: dots(on), kcalOff: dots(total - on),
macros: [mac('PROTEIN', 92, 160), mac('CARBS', 118, 260), mac('FAT', 38, 75)],
waterOn: dots(5), waterOff: dots(3)
};
}
}
</script>
