<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>FFT admin</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Sign in -->
    <section id="login" class="login" hidden>
      <form id="loginForm" class="card login-card">
        <div class="brand"><span class="brand-ring" aria-hidden="true"></span>FFT admin</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in with the admin password to look after the app and its people.</p>
        <label class="field">
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span>Code from your authenticator app</span>
          <input
            id="loginCode"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9 ]{6,7}"
            maxlength="7"
            required
          />
        </label>
        <p id="loginError" class="error" role="alert"></p>
        <button class="btn primary block" type="submit">Sign in</button>
      </form>
    </section>

    <!-- The panel -->
    <div id="app" class="shell" hidden>
      <aside class="sidebar" aria-label="Sections">
        <div class="brand"><span class="brand-ring" aria-hidden="true"></span>FFT admin</div>
        <nav id="nav" class="nav"></nav>
        <button id="logout" class="nav-item subtle" type="button">Sign out</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p id="pageKicker" class="kicker"></p>
            <h1 id="pageTitle"></h1>
          </div>
          <div class="lock" id="lockBox">
            <span id="lockState" class="lock-state"></span>
            <button id="lockButton" class="btn" type="button"></button>
          </div>
        </header>
        <div id="editingBanner" class="banner" hidden role="status"></div>
        <p id="pageIntro" class="intro muted"></p>
        <div id="page" class="page"></div>
      </main>
    </div>

    <!-- Unlock editing -->
    <dialog id="unlockDialog">
      <form id="unlockForm" method="dialog" class="dialog">
        <h2>Unlock editing</h2>
        <p class="muted">
          While editing is unlocked you can change and delete real data. Every change is written in
          the change log. It locks again by itself after 10 minutes.
        </p>
        <label class="field">
          <span>Admin password</span>
          <input id="unlockPassword" type="password" autocomplete="current-password" required />
        </label>
        <p id="unlockError" class="error" role="alert"></p>
        <div class="row end">
          <button type="button" class="btn ghost" data-close>Cancel</button>
          <button type="submit" class="btn primary">Unlock</button>
        </div>
      </form>
    </dialog>

    <!-- A general dialog (details, confirmations, forms) filled by app.js -->
    <dialog id="dialog">
      <div class="dialog" id="dialogBody"></div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
